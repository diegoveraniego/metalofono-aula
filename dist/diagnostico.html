<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico · Metalófono Aula</title><link rel="stylesheet" href="style.css"><main><h1>Diagnóstico del navegador</h1><p><a href="./">← Volver a la aplicación</a></p><button id="run" class="primary">Probar importadores, audio y video</button><button id="pitch" class="secondary">Escuchar Do♯5 → Si4 (campanas corregidas)</button><pre id="results" style="white-space:pre-wrap"></pre><canvas id="testCanvas" width="320" height="180" style="max-width:320px"></canvas><video id="video" controls style="max-width:320px"></video><script type="module">
import {parseXML,parseFile} from './js/parser.js';import {AudioEngine} from './js/metronome.js';
const out=document.getElementById('results');const check=(ok,label)=>{out.textContent+=(ok?'✓ ':'✗ ')+label+'\n';if(!ok)throw Error(label);};
const pitchAudio=new AudioEngine();document.getElementById('pitch').onclick=async()=>{try{await pitchAudio.init();pitchAudio.cancel();pitchAudio.metalTone='compas';const at=pitchAudio.ctx.currentTime+.1;pitchAudio.note({midi:73,velocity:.8},at);pitchAudio.note({midi:71,velocity:.8},at+1.3);out.textContent='Campanas corregidas: Do♯5 (554,37 Hz) → Si4 (493,88 Hz). Sin acompañamiento ni metrónomo.\n';}catch(e){out.textContent=e.message;}};
document.getElementById('run').onclick=async()=>{out.textContent='';try{
 for(const ext of ['musicxml','mxl','mid']){const res=await fetch('examples/himno.'+ext);const score=await parseFile(new File([await res.blob()],'himno.'+ext));check(score.parts[0].notes.length===30,ext+': 30 notas');check(score.parts[0].measures.length===8,ext+': 8 compases');check(score.parts[0].tempos[0].bpm===96,ext+': 96 BPM');}
 const score=parseXML('<score-partwise><part-list><score-part id="p"><part-name>Test</part-name></score-part></part-list><part id="p"><measure number="1"><attributes><divisions>2</divisions><time><beats>4</beats><beat-type>4</beat-type></time></attributes><note><pitch><step>C</step><octave>4</octave></pitch><duration>8</duration><voice>1</voice><tie type="start"/></note><backup><duration>8</duration></backup><note><pitch><step>E</step><octave>4</octave></pitch><duration>4</duration><voice>2</voice></note><forward><duration>4</duration></forward></measure><measure number="2"><note><pitch><step>C</step><octave>4</octave></pitch><duration>8</duration><voice>1</voice><tie type="stop"/></note></measure></part></score-partwise>');
 check(score.parts[0].notes.length===2,'MusicXML: voces con backup y forward');check(score.parts[0].notes[0].duration===8,'MusicXML: ligadura entre compases');check(score.parts[0].notes[1].start===0,'MusicXML: ataques simultáneos');
 const audio=new AudioEngine();await audio.init();audio.note({midi:67,velocity:.6},audio.ctx.currentTime);audio.click(true,audio.ctx.currentTime+.4);check(audio.ctx.state==='running','AudioContext activo: debes oír una nota y un clic');
 const canvas=document.getElementById('testCanvas'),c=canvas.getContext('2d');if(!globalThis.MediaRecorder||!canvas.captureStream){out.textContent+='⚠ Sin grabación integrada; usar captura externa.\n';return;}
 const type=['video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t));check(Boolean(type),'Formato de video: '+type);const stream=canvas.captureStream(30);stream.addTrack(audio.capture.stream.getAudioTracks()[0]);const rec=new MediaRecorder(stream,{mimeType:type}),chunks=[];let frame=0;const interval=setInterval(()=>{c.fillStyle='#305b48';c.fillRect(0,0,320,180);c.fillStyle='#fff';c.font='22px sans-serif';c.fillText('Audio + video · '+frame++,30,100);},33);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{clearInterval(interval);const blob=new Blob(chunks,{type});check(blob.size>0,'Video creado: '+blob.size+' bytes');document.getElementById('video').src=URL.createObjectURL(blob);out.textContent+='Reproduce el video para confirmar imagen y audio.\n';stream.getVideoTracks().forEach(t=>t.stop());};rec.start();audio.note({midi:72,velocity:.6},audio.ctx.currentTime+.3);setTimeout(()=>rec.stop(),1200);
 }catch(e){out.textContent+='ERROR: '+e.message+'\n';}};
</script></main></html>
